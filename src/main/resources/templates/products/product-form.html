<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nhập sản phẩm</title>
    <style>
        body {
            font: 16px Arial;
            max-width: 760px;
            margin: 40px auto;
            padding: 0 20px;
            color: #172033;
        }

        form {
            display: grid;
            gap: 13px;
            padding: 22px;
            border: 1px solid #d9e0ea;
            border-radius: 12px;
        }

        label {
            display: grid;
            gap: 6px;
        }

        input,
        select {
            padding: 10px;
            border: 1px solid #bbc5d3;
            border-radius: 6px;
        }

        button,
        a {
            padding: 10px 14px;
            background: #175cd3;
            color: white;
            border: 0;
            border-radius: 7px;
            text-decoration: none;
        }

        .error {
            padding: 12px;
            background: #fff0f0;
            color: #a11;
            border-radius: 7px;
        }
    </style>
</head>
<body>
    <h1>Nhập sản phẩm mới</h1>
    <p class="error" th:if="${errorMessage != null}" th:text="${errorMessage}"></p>

    <form th:action="@{/products}" th:object="${product}" method="post">
        <label>
            Mã sản phẩm
            <input th:field="*{productId}">
        </label>
        <label>
            Tên sản phẩm
            <input th:field="*{productName}" required>
        </label>
        <label>
            Giá sản phẩm
            <input type="number" step="0.01" min="0.01" th:field="*{price}" required>
        </label>
        <label>
            Số lượng
            <input type="number" min="0" th:field="*{quantity}">
        </label>
        <label>
            Mã loại sản phẩm
            <input th:field="*{categoryId}">
        </label>
        <label>
            Trạng thái
            <select th:field="*{active}">
                <option value="true">Còn bán</option>
                <option value="false">Ngừng bán</option>
            </select>
        </label>
        <button type="submit">Gửi thông tin</button>
    </form>

    <p><a th:href="@{/}">Về trang chủ</a></p>
</body>
</html>
