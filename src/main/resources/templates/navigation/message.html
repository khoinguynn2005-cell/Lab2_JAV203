<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thông báo</title>
    <style>
        body {
            font: 16px Arial;
            max-width: 700px;
            margin: 50px auto;
            padding: 0 20px;
            color: #172033;
        }

        .box {
            padding: 24px;
            background: #eef4ff;
            border-radius: 12px;
        }

        a {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 14px;
            background: #175cd3;
            color: white;
            border-radius: 7px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h1>Thông báo</h1>
    <div class="box" th:text="${message}"></div>
    <a th:href="@{/}">Về trang chủ</a>
</body>
</html>
