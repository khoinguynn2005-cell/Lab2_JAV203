<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kết quả tìm kiếm</title>
    <style>
        body {
            font: 16px Arial;
            max-width: 760px;
            margin: 40px auto;
            padding: 0 20px;
            color: #172033;
        }

        .card {
            padding: 22px;
            border: 1px solid #d9e0ea;
            border-radius: 12px;
            background: #f7f9fc;
        }

        a {
            display: inline-block;
            margin: 8px 8px 8px 0;
            padding: 10px 14px;
            background: #175cd3;
            color: white;
            border-radius: 7px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h1>Thông tin tìm kiếm</h1>
    <div class="card">
        <p>Mã loại sản phẩm: <strong th:text="${categoryId}"></strong></p>
        <p>Từ khóa: <strong th:text="${keyword == '' ? '(trống)' : keyword}"></strong></p>
        <p>Trang hiện tại: <strong th:text="${page}"></strong></p>
        <p>Số sản phẩm mỗi trang: <strong th:text="${size}"></strong></p>
        <p th:text="${searchMessage}"></p>
    </div>
    <a th:href="@{/products/search}">Tìm lại</a>
    <a th:href="@{/}">Trang chủ</a>
</body>
</html>
